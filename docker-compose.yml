version: '3.9'

services:

  schoolmanagement-api:
    image: schoolmanagement-api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolmanagement-api

    ports:
      - "8080:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SchoolManagementDb;User=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - Redis__ConnectionString=redis:6379

    depends_on:
      - sqlserver
      - redis

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: schoolmanagement-sqlserver

    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd

    ports:
      - "1433:1433"

  redis:
    image: redis:latest
    container_name: schoolmanagement-redis

    ports:
      - "6379:6379"